# Navvia — LibreChat runtime configuration
# https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.14
cache: true

# ==============================================================================
# FILE STRATEGIES
# ==============================================================================
fileStrategies:
  default: "local"
  avatar: "local"
  image: "local"
  document: "local"

# ==============================================================================
# FILE CONFIGURATION
# ==============================================================================
fileConfig:
  serverFileSizeLimit: 1000
  avatarSizeLimit: 10
  fileTokenLimit: 200000

  endpoints:
    default:
      fileLimit: 50
      fileSizeLimit: 1000
      totalSizeLimit: 1500

  imageGeneration:
    percentage: 100

  clientImageResize:
    enabled: true
    maxWidth: 2048
    maxHeight: 2048
    quality: 0.9

  ocr:
    enabled: true
    supportedMimeTypes:
      - "^image/(jpeg|gif|png|webp|heic|heif)$"
      - "^application/pdf$"
      - "^application/vnd\\.openxmlformats-officedocument\\.(wordprocessingml\\.document|presentationml\\.presentation|spreadsheetml\\.sheet)$"
      - "^application/vnd\\.ms-(word|powerpoint|excel)$"
      - "^application/epub\\+zip$"

  text:
    enabled: true
    supportedMimeTypes:
      - "^text/(plain|markdown|csv|json|xml|html|css|javascript|typescript|x-python|x-java|x-csharp|x-php|x-ruby|x-go|x-rust|x-kotlin|x-swift|x-scala|x-perl|x-lua|x-shell|x-sql|x-yaml|x-toml)$"

  stt:
    enabled: true
    supportedMimeTypes:
      - "^audio/(mp3|mpeg|mpeg3|wav|wave|x-wav|ogg|vorbis|mp4|x-m4a|flac|x-flac|webm)$"

# ==============================================================================
# INTERFACE  (v1.3.8: sidePanel e endpointsMenu removidos)
# ==============================================================================
interface:
  customWelcome: |-
    Olá, {{user.name}}! Bem-vindo ao Navvia.

  artifacts: true
  fileSearch: true
  fileCitations: true
  modelSelect: true
  parameters: true
  presets: false
  bookmarks: true
  multiConvo: true
  runCode: true

  prompts:
    use: true
    create: true
    share: true
    public: false

  agents:
    use: true
    create: true
    share: true
    public: false

  peoplePicker:
    users: true
    groups: true
    roles: true

  marketplace:
    use: true

  mcpServers:
    use: true
    create: true
    share: true
    public: false

  skills:
    use: true
    create: true
    share: false
    public: false
    defaultActiveOnShare: false

  temporaryChatRetention: 720

  # [1.3.13] Medidor de uso da janela de contexto e custo por conversa.
  # Relevante aqui porque o produto e cobrado por creditos: o usuario passa a
  # ver o que esta consumindo antes de estourar o saldo.
  contextUsage: true
  contextCost: true
  # Converte o custo exibido de USD para outra moeda. `rate` e a taxa USD->code
  # e e ESTATICA: precisa ser revisada periodicamente, senao o valor mostrado ao
  # usuario descola do que ele realmente esta gastando. Ajuste antes de habilitar.
  currency:
    code: BRL
    rate: 5.40

  # [1.3.13] Permissoes de compartilhamento de conversa por link.
  sharedLinks:
    create: true
    share: true
    public: false
    snapshotFiles: true

  # [1.3.13] Ferramentas ja fixadas na barra do compositor. Apenas semeia o
  # estado inicial — depois que o usuario fixa/desafixa, a escolha dele vence.
  defaultPinnedTools:
    - 'artifacts'
    - 'web_search'
    - 'execute_code'

  # [1.3.12] Escopo da retencao de dados. 'temporary' (default) aplica a
  # expiracao so a chats temporarios; 'all' estende a todos os dados.
  # ATENCAO: voltar de 'all' para 'temporary' exige limpar os expiredAt
  # remanescentes — ver librechat.example.yaml para os updateMany necessarios.
  # retentionMode: temporary
  # [1.3.13] Sob retentionMode 'all', isenta arquivos persistentes de agentes.
  # retainAgentFiles: false

# ==============================================================================
# SPEECH
# ==============================================================================
speech:
  tts:
    openai:
      url: ''
      apiKey: '${TTS_API_KEY}'
      model: 'tts-1'
      voices: ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer']
  stt:
    openai:
      url: ''
      apiKey: '${OPENAI_API_KEY}'
      model: 'whisper-1'

# ==============================================================================
# MEMORY
# ==============================================================================
memory:
  disabled: false
  validKeys: ["user_preferences", "conversation_context", "learned_facts", "personal_information"]
  tokenLimit: 300000
  charLimit: 15000
  personalize: true
  # [1.3.13] Teto de tokens de chat recente enviados ao agente de memoria.
  # Controle de custo: sem isto o default do upstream e aplicado.
  maxInputTokens: 30000
  agent:
    # OBRIGATORIO. isMemoryAgentEnabled() exige `enabled === true` — sem esta
    # linha a extracao automatica NAO roda (memorias existentes ainda sao lidas).
    enabled: true
    provider: "openAI"
    model: "gpt-5.6-luna"
    instructions: |
      Store memory using only the specified validKeys.
      Prioritize retaining context from uploaded files and user instructions.
      Delete outdated or incorrect information promptly.
    model_parameters:
      temperature: 0.2
      max_tokens: 2500
      top_p: 0.8
      frequency_penalty: 0.1

# ==============================================================================
# REGISTRATION & SECURITY
# ==============================================================================
registration:
  socialLogins: ['github', 'google', 'discord', 'openid', 'facebook', 'apple', 'saml']
  ipLimit:
    max: 0
  userLimit:
    max: 0

actions:
  allowedDomains:
    - 'api.github.com'
    - 'api.stackexchange.com'
    - 'librechat.ai'
    - 'api.apify.com'

# ==============================================================================
# BALANCE & TRANSACTIONS  (admin-ext depende de ambos)
# ==============================================================================
balance:
  enabled: true
  startBalance: 0
  autoRefillEnabled: false
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 0

transactions:
  enabled: true

# ==============================================================================
# ENDPOINTS
# ==============================================================================
endpoints:
  # [1.3.13] Default global para todos os endpoints.
  all:
    # 'immediate' gera o titulo em paralelo com a resposta (aparece em ~1-2s);
    # 'final' e o comportamento antigo, so ao terminar.
    titleTiming: immediate

  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities:
      - "deferred_tools"
      - "execute_code"
      - "file_search"
      - "context"
      - "ocr"
      - "artifacts"
      - "web_search"
      - "tools"
      - "actions"
      - "chain"
      - "subagents"
      - "skills"
      # [1.3.14] Faltavam: sem 'memory' o agente nao acessa a memoria mesmo com
      # a secao memory configurada.
      - "memory"
      - "ask_user_question"

    # [1.3.14] Aborta a execucao quando os argumentos de UMA tool call passam
    # do limite — contencao contra geracao malformada em loop. 0 desliga.
    maxToolCallArgBytes: 65536
    maxToolCallArgBytesByTool:
      create_file: 131072

  openAI:
    apiKey: "${OPENAI_API_KEY}"
    baseURL: "https://api.openai.com/v1"
    models:
      default:
        - "gpt-5.6-sol"
        - "gpt-5.6-terra"
        - "gpt-5.6-luna"
      fetch: false
    titleConvo: true
    titleMethod: "completion"
    titleModel: "gpt-5.6-luna"

  anthropic:
    apiKey: "${ANTHROPIC_API_KEY}"
    models:
      - "claude-fable-5"
      - "claude-opus-5"
      - "claude-sonnet-5"

  google:
    apiKey: "${GEMINI_API_KEY}"
    models:
      default:
        - "gemini-3.6-flash"
        - "gemini-3.5-flash"
        - "gemini-3.5-flash-lite"
      fetch: false

  custom:
    - name: "xai"
      apiKey: "${XAI_API_KEY}"
      baseURL: "https://api.x.ai/v1"
      models:
        default:
          - "grok-4.6"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "grok-4.6"
      modelDisplayLabel: "Grok"
      # [1.3.13] tokenConfig — OBRIGATORIO aqui. Nenhum grok-4.x novo existe na
      # tabela do LibreChat, e findMatchingPattern cai no maior `includes`, que e
      # 'grok-4' (3.00/15.00). O preco real do grok-4.6 e 2/6 — ou seja, sem isto
      # a plataforma cobra 1,5x a mais na entrada e 2,5x a mais na saida.
      #
      # tokenConfig NAO suporta faixa: a xAI dobra a tarifa a partir de 200k
      # tokens de prompt (2/6 -> 4/12). Fixamos a tarifa BAIXA, que e a correta
      # para a variante 200K e para a maioria das requisicoes na variante 500K.
      # Acima de 200k na variante completa a cobranca fica ABAIXO do custo real.
      tokenConfig:
        grok-4.6:
          prompt: 2
          completion: 6
          context: 500000
          cacheRead: 0.5

    # ── Moonshot / Kimi ─────────────────────────────────────────────────────────
    # O nome "moonshot" nao e arbitrario: bate com KnownEndpoints.moonshot, que
    # ativa o icone dedicado (MoonshotIcon) e o tratamento de provider proprio.
    - name: "moonshot"
      apiKey: "${MOONSHOT_API_KEY}"
      baseURL: "https://api.moonshot.ai/v1"
      models:
        default:
          - "kimi-k3"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "kimi-k3"
      modelDisplayLabel: "Kimi"
      # [1.3.13] tokenConfig — OBRIGATORIO. kimi-k3 nao existe na tabela do
      # LibreChat (e mais novo que o v0.8.8-rc1) e nao casa com nenhuma chave:
      # as entradas kimi-* param no k2. Sem override cai no defaultRate de 6/6,
      # cobrando o dobro na entrada e 2,5x MENOS na saida que o custo real.
      # Preco oficial: 3.00 entrada / 15.00 saida / 0.30 cache hit. Sem faixas.
      tokenConfig:
        kimi-k3:
          prompt: 3
          completion: 15
          context: 1048576
          cacheRead: 0.3

    # ── Z.ai / GLM ──────────────────────────────────────────────────────────────
    - name: "zai"
      apiKey: "${ZAI_API_KEY}"
      baseURL: "https://api.z.ai/api/paas/v4"
      models:
        default:
          - "glm-5.3"
          - "glm-5.3-flash"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "glm-5.3-flash"
      modelDisplayLabel: "GLM"
      # [1.3.13] tokenConfig — OBRIGATORIO. Nenhum glm-5.x existe na tabela do
      # LibreChat (ela para no glm-4.6) e nao casa com nenhuma chave, entao cai
      # no defaultRate de 6/6. Para o Flash isso seria 40x a mais na entrada.
      # Sem faixas de contexto em nenhum dos dois.
      #
      # NOTA: o Flash esta com 50% de desconto promocional ate 09/09/2026
      # (0.075 / 0.25). Usamos a tarifa CHEIA — se a promo fosse lancada aqui,
      # apos o vencimento a plataforma cobraria metade do custo real, em silencio.
      tokenConfig:
        glm-5.3:
          prompt: 1.4
          completion: 4.4
          context: 1048576
          cacheRead: 0.26
        glm-5.3-flash:
          prompt: 0.15
          completion: 0.5
          context: 1048576
          cacheRead: 0.03

# ==============================================================================
# MODEL SPECS
# ==============================================================================
modelSpecs:
  # prioritize: true e o default — os specs aparecem primeiro no seletor, mas o
  # usuario ainda consegue escolher um modelo cru do endpoint.
  #
  # enforce: true restringe a APENAS estes specs. Vale considerar: o catalogo e
  # curado, a cobranca e por credito e o admin-ext controla acesso por spec —
  # sem enforce, um usuario pode selecionar um modelo fora da lista, cuja
  # precificacao voces nao revisaram.
  # enforce: true
  addedEndpoints:
    - agents
  list:

    # ── Anthropic ───────────────────────────────────────────────────────────────
    # Fable 5, Opus 5 e Sonnet 5 sao "adaptive thinking always on" e REJEITAM
    # parametros de sampling (temperature/top_p) — ver omitsSamplingParameters().
    # Nao ha faixa de preco premium para Claude: 1M e 200K custam a MESMA tarifa
    # por token. A versao reduzida serve para limitar o custo POR REQUISICAO,
    # evitando que o contexto cresca sem teto numa conversa longa.
    - name: "claude-fable-5-1m"
      label: "Claude Fable 5 Raciocínio Profundo"
      description: "Percorre bases de código inteiras e acervos longos sem perder o fio da meada. Para agentes que trabalham por horas."
      preset:
        endpoint: anthropic
        model: "claude-fable-5"
        maxContextTokens: 1000000
        max_tokens: 128000

    - name: "claude-fable-5-200k"
      label: "Claude Fable 5"
      description: "Inteligência de próxima geração para tarefas complexas e agentes autônomos."
      preset:
        endpoint: anthropic
        model: "claude-fable-5"
        maxContextTokens: 200000
        max_tokens: 128000

    - name: "claude-opus-5-1m"
      label: "Claude Opus 5 Raciocínio Profundo"
      description: "Raciocina sobre repositórios completos e conjuntos extensos de documentos numa única conversa."
      preset:
        endpoint: anthropic
        model: "claude-opus-5"
        maxContextTokens: 1000000
        max_tokens: 128000

    - name: "claude-opus-5-200k"
      label: "Claude Opus 5"
      description: "Programação agêntica complexa e trabalho corporativo. Recomendado para a maioria das tarefas difíceis."
      # softDefault: default apenas para quem ainda nao escolheu nada; nao
      # sobrepoe a escolha ja feita. Aponta para a variante reduzida de
      # proposito — mesma tarifa, teto de custo por requisicao menor.
      softDefault: true
      preset:
        endpoint: anthropic
        model: "claude-opus-5"
        maxContextTokens: 200000
        max_tokens: 128000

    - name: "claude-sonnet-5-1m"
      label: "Claude Sonnet 5 Raciocínio Profundo"
      description: "Une velocidade e profundidade em material extenso: pesquisa longa e revisão de código em escala."
      preset:
        endpoint: anthropic
        model: "claude-sonnet-5"
        maxContextTokens: 1000000
        max_tokens: 128000

    - name: "claude-sonnet-5-200k"
      label: "Claude Sonnet 5"
      description: "A melhor combinação de velocidade e inteligência para o dia a dia."
      preset:
        endpoint: anthropic
        model: "claude-sonnet-5"
        maxContextTokens: 200000
        max_tokens: 128000

    # ── OpenAI ──────────────────────────────────────────────────────────────────
    # A familia GPT-5.6 TEM faixa premium: acima de 272.000 tokens de entrada a
    # tarifa DOBRA (Sol 5/30 -> 10/45; Terra 2.5/15 -> 5/22.5; Luna 1/6 -> 2/9).
    # O corte e `inputTokenCount <= threshold`, entao 272000 exatos ainda pagam a
    # tarifa padrao. As variantes reduzidas usam esse teto — e literalmente
    # metade do preco, nao so metade do contexto.
    - name: "gpt-56-sol-1m"
      label: "GPT-5.6 Sol Raciocínio Profundo"
      description: "Para trabalho que exige cruzar muitas fontes: análises longas, auditorias e relatórios densos."
      preset:
        endpoint: openAI
        model: "gpt-5.6-sol"
        maxContextTokens: 1050000
        max_tokens: 128000

    - name: "gpt-56-sol-272k"
      label: "GPT-5.6 Sol"
      description: "Modelo de fronteira para trabalho profissional complexo."
      preset:
        endpoint: openAI
        model: "gpt-5.6-sol"
        maxContextTokens: 272000
        max_tokens: 128000

    - name: "gpt-56-terra-1m"
      label: "GPT-5.6 Terra Raciocínio Profundo"
      description: "Capacidade analítica aplicada a grandes volumes de texto e dados."
      preset:
        endpoint: openAI
        model: "gpt-5.6-terra"
        maxContextTokens: 1050000
        max_tokens: 128000

    - name: "gpt-56-terra-272k"
      label: "GPT-5.6 Terra"
      description: "Equilíbrio entre capacidade e agilidade nas tarefas do dia a dia."
      preset:
        endpoint: openAI
        model: "gpt-5.6-terra"
        maxContextTokens: 272000
        max_tokens: 128000

    - name: "gpt-56-luna-1m"
      label: "GPT-5.6 Luna Raciocínio Profundo"
      description: "Processa grandes volumes de conteúdo mantendo resposta rápida."
      preset:
        endpoint: openAI
        model: "gpt-5.6-luna"
        maxContextTokens: 1050000
        max_tokens: 128000

    - name: "gpt-56-luna-272k"
      label: "GPT-5.6 Luna"
      description: "Rápido e direto, para tarefas objetivas e alto volume."
      preset:
        endpoint: openAI
        model: "gpt-5.6-luna"
        maxContextTokens: 272000
        max_tokens: 128000

    # ── Google ──────────────────────────────────────────────────────────────────
    # Sem faixa premium na tabela do LibreChat para a familia 3.5/3.6 Flash
    # (apenas gemini-3.1 tem, em 200k). A variante reduzida aqui e teto de custo
    # por requisicao, nao mudanca de tarifa — por isso metade do contexto.
    - name: "gemini-36-flash-1m"
      label: "Gemini 3.6 Flash Raciocínio Profundo"
      description: "Multimodal sobre material extenso: vídeos longos e documentos com muitas imagens."
      preset:
        endpoint: google
        model: "gemini-3.6-flash"
        maxContextTokens: 1048576
        maxOutputTokens: 65536

    - name: "gemini-36-flash-500k"
      label: "Gemini 3.6 Flash"
      description: "Rápido e multimodal, para tarefas gerais do dia a dia."
      preset:
        endpoint: google
        model: "gemini-3.6-flash"
        maxContextTokens: 524288
        maxOutputTokens: 65536

    - name: "gemini-35-flash-1m"
      label: "Gemini 3.5 Flash Raciocínio Profundo"
      description: "Contexto amplo com a velocidade da família Flash, para leitura em volume."
      preset:
        endpoint: google
        model: "gemini-3.5-flash"
        maxContextTokens: 1048576
        maxOutputTokens: 65536

    - name: "gemini-35-flash-500k"
      label: "Gemini 3.5 Flash"
      description: "Desempenho consistente em tarefas rotineiras de alto volume."
      preset:
        endpoint: google
        model: "gemini-3.5-flash"
        maxContextTokens: 524288
        maxOutputTokens: 65536

    - name: "gemini-35-flash-lite-1m"
      label: "Gemini 3.5 Flash-Lite Raciocínio Profundo"
      description: "Leitura de grandes volumes com a menor latência da família 3.5."
      preset:
        endpoint: google
        model: "gemini-3.5-flash-lite"
        maxContextTokens: 1048576
        maxOutputTokens: 65536

    - name: "gemini-35-flash-lite-500k"
      label: "Gemini 3.5 Flash-Lite"
      description: "O mais ágil da família 3.5, para respostas rápidas e diretas."
      preset:
        endpoint: google
        model: "gemini-3.5-flash-lite"
        maxContextTokens: 524288
        maxOutputTokens: 65536

    # ── xAI ─────────────────────────────────────────────────────────────────────
    # A xAI DOBRA a tarifa a partir de 200k tokens de prompt (2/6 -> 4/12), entao
    # a variante reduzida fica sob esse teto: e metade do PRECO, nao so do contexto.
    # maxContextTokens reserva max_tokens para a saida, entao o prompt efetivo
    # fica confortavelmente abaixo de 200k.
    - name: "grok-46-500k"
      label: "Grok 4.6 Raciocínio Profundo"
      description: "Raciocina sobre projetos inteiros e conversas muito longas, com busca em tempo real."
      preset:
        endpoint: xai
        model: "grok-4.6"
        maxContextTokens: 500000
        max_tokens: 32000
        temperature: 0.7

    - name: "grok-46-200k"
      label: "Grok 4.6"
      description: "O modelo mais inteligente e rápido da xAI, para chat e código."
      preset:
        endpoint: xai
        model: "grok-4.6"
        maxContextTokens: 200000
        max_tokens: 32000
        temperature: 0.7

    # ── Moonshot / Kimi ─────────────────────────────────────────────────────────
    # Sem faixa premium: a tarifa do K3 e unica em qualquer tamanho de contexto.
    - name: "kimi-k3-1m"
      label: "Kimi K3 Raciocínio Profundo"
      description: "Contexto completo de 1M com entendimento visual nativo, para engenharia de software e raciocínio profundo."
      preset:
        endpoint: moonshot
        model: "kimi-k3"
        maxContextTokens: 1048576
        max_tokens: 32000
        temperature: 0.7

    - name: "kimi-k3-500k"
      label: "Kimi K3"
      description: "Modelo de fronteira da Kimi, com entendimento visual nativo e forte desempenho em código."
      preset:
        endpoint: moonshot
        model: "kimi-k3"
        maxContextTokens: 524288
        max_tokens: 32000
        temperature: 0.7

    # ── Z.ai / GLM ──────────────────────────────────────────────────────────────
    # Sem faixa premium: tarifa unica em qualquer tamanho de contexto.
    - name: "glm-53-1m"
      label: "GLM-5.3 Raciocínio Profundo"
      description: "Contexto completo de 1M para tarefas de longo horizonte: refatorações amplas e agentes que trabalham por horas."
      preset:
        endpoint: zai
        model: "glm-5.3"
        maxContextTokens: 1048576
        max_tokens: 128000
        temperature: 0.7

    - name: "glm-53-500k"
      label: "GLM-5.3"
      description: "Capacidade de código e agentes no nível dos modelos de fronteira, com forte desempenho em tarefas complexas."
      preset:
        endpoint: zai
        model: "glm-5.3"
        maxContextTokens: 524288
        max_tokens: 128000
        temperature: 0.7

    - name: "glm-53-flash-1m"
      label: "GLM-5.3 Flash Raciocínio Profundo"
      description: "Contexto completo de 1M em um modelo multimodal nativo de resposta rápida."
      preset:
        endpoint: zai
        model: "glm-5.3-flash"
        maxContextTokens: 1048576
        max_tokens: 128000
        temperature: 0.7

    - name: "glm-53-flash-500k"
      label: "GLM-5.3 Flash"
      description: "Multimodal nativo com inteligência de fronteira e a melhor relação capacidade/agilidade do catálogo."
      preset:
        endpoint: zai
        model: "glm-5.3-flash"
        maxContextTokens: 524288
        max_tokens: 128000
        temperature: 0.7

    # ── Geração de Imagem ────────────────────────────────────────────────────────
    # Para ativar: crie um agente com a tool "image_gen_oai", copie o agent_id
    # da URL (/agents/<id>) e substitua abaixo. Requer IMAGE_GEN_OAI_API_KEY no .env.
    #
    # - name: "grok-imagine"
    #   label: "Grok Imagine (Gerar Imagem)"
    #   preset:
    #     endpoint: agents
    #     agent_id: "COLE_O_AGENT_ID_AQUI"

# ==============================================================================
# WEB SEARCH
# ==============================================================================
webSearch:
  serperApiKey: "${SERPER_API_KEY}"
  searchProvider: "serper"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  scraperProvider: "firecrawl"
  jinaApiKey: "${JINA_API_KEY}"
  cohereApiKey: "${COHERE_API_KEY}"
  rerankerType: "jina"
  scraperTimeout: 15000
  safeSearch: 0
  # [1.3.14] Requisicoes de saida passaram a ser validadas contra o IP resolvido:
  # destinos privados, loopback, link-local e metadata de nuvem sao BLOQUEADOS.
  # Se FIRECRAWL_API_URL apontar para um Firecrawl self-hosted, ele precisa estar
  # listado aqui ou o scraping para de funcionar. Sempre com porta; nunca URL,
  # caminho, faixa CIDR ou IP publico.
  # allowedAddresses:
  #   - 'firecrawl:3002'

